[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "international-airlines"
version = "1.0.0"
description = "EDA, Prophet forecasting, and anomaly/cluster analysis of Australian international air traffic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirhossein Jafarnezhad" }]
keywords = ["time-series", "forecasting", "prophet", "anomaly-detection", "clustering", "aviation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.3,<2.0",
    "prophet>=1.1,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
international-airlines = "international_airlines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
